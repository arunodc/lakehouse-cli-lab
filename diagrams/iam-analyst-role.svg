<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 230" role="img" aria-label="Diagram: the LakehouseAnalyst role is trusted by the account-root idiom, meaning whoever separately gets sts:AssumeRole on it. Its permissions policy only reaches Athena, read-only Glue metadata, the lakeformation:GetDataAccess action, and the athena-results S3 bucket — never the raw or curated data buckets directly. That gap is filled by a Lake Formation grant, not an IAM permission.">
  <defs>
    <marker id="ar-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#566864"/></marker>
    <marker id="ar-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0e6b73"/></marker>
  </defs>

  <rect x="0" y="0" width="900" height="230" fill="#ffffff"/>

  <text x="20" y="24" font-family="'IBM Plex Mono', monospace" font-size="10.5" font-weight="700" letter-spacing="0.05em" fill="#0e6b73">LAKEHOUSEANALYST — TRUST IN, PERMISSIONS OUT</text>

  <rect x="20" y="60" width="170" height="70" rx="8" fill="#ffffff" stroke="#dbe4e0" stroke-width="1.4"/>
  <text x="105" y="80" text-anchor="middle" font-family="'Public Sans', system-ui, sans-serif" font-size="9" fill="#566864">AWS account principal</text>
  <text x="105" y="98" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="9.5" font-weight="700" fill="#16211f">...:root idiom</text>
  <text x="105" y="115" text-anchor="middle" font-family="'Public Sans', system-ui, sans-serif" font-size="8" fill="#566864">whoever assumes this role</text>

  <line x1="190" y1="95" x2="298" y2="95" stroke="#566864" stroke-width="1.5" marker-end="url(#ar-muted)"/>
  <text x="244" y="85" text-anchor="middle" font-family="'Public Sans', system-ui, sans-serif" font-size="9" fill="#16211f">sts:AssumeRole</text>

  <rect x="300" y="35" width="220" height="125" rx="8" fill="#ffffff" stroke="#dbe4e0" stroke-width="1.4"/>
  <text x="410" y="55" text-anchor="middle" font-family="'Public Sans', system-ui, sans-serif" font-size="9" fill="#566864">IAM role</text>
  <text x="410" y="74" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="11" font-weight="700" fill="#16211f">LakehouseAnalyst</text>
  <text x="410" y="91" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="8.5" fill="#566864">trust: account root idiom</text>
  <text x="410" y="110" text-anchor="middle" font-family="'Public Sans', system-ui, sans-serif" font-size="8" fill="#566864">no S3 permission on raw or curated</text>
  <text x="410" y="125" text-anchor="middle" font-family="'Public Sans', system-ui, sans-serif" font-size="8" fill="#566864">buckets — on purpose</text>
  <text x="410" y="143" text-anchor="middle" font-family="'Public Sans', system-ui, sans-serif" font-size="8" fill="#0e6b73">(that gap is Lock 2's job — Lake Formation)</text>

  <rect x="600" y="10" width="280" height="42" rx="8" fill="#ffffff" stroke="#dbe4e0" stroke-width="1.4"/>
  <text x="740" y="28" text-anchor="middle" font-family="'Public Sans', system-ui, sans-serif" font-size="10" font-weight="700" fill="#16211f">Athena</text>
  <text x="740" y="44" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="8.5" fill="#566864">athena:* — run queries, own workgroup</text>

  <rect x="600" y="60" width="280" height="42" rx="8" fill="#ffffff" stroke="#dbe4e0" stroke-width="1.4"/>
  <text x="740" y="78" text-anchor="middle" font-family="'Public Sans', system-ui, sans-serif" font-size="10" font-weight="700" fill="#16211f">Glue Data Catalog</text>
  <text x="740" y="94" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="8.5" fill="#566864">glue:Get* — schema/metadata only</text>

  <rect x="600" y="110" width="280" height="52" rx="8" fill="#e2f1f1" stroke="#0e6b73" stroke-width="1.8"/>
  <text x="740" y="128" text-anchor="middle" font-family="'Public Sans', system-ui, sans-serif" font-size="10" font-weight="700" fill="#0e6b73">Lake Formation</text>
  <text x="740" y="144" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="9" font-weight="700" fill="#0e6b73">lakeformation:GetDataAccess</text>
  <text x="740" y="158" text-anchor="middle" font-family="'Public Sans', system-ui, sans-serif" font-size="8" fill="#566864">opens the door — Lock 1 of 2</text>

  <rect x="600" y="172" width="280" height="50" rx="8" fill="#ffffff" stroke="#dbe4e0" stroke-width="1.4"/>
  <text x="740" y="189" text-anchor="middle" font-family="'Public Sans', system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#16211f">S3 — athena-results bucket ONLY</text>
  <text x="740" y="204" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="8.5" fill="#566864">Get/Put/ListBucket/GetBucketLocation</text>
  <text x="740" y="217" text-anchor="middle" font-family="'Public Sans', system-ui, sans-serif" font-size="8" fill="#a5342f">NOT raw or curated — no direct path</text>

  <line x1="520" y1="70" x2="598" y2="31" stroke="#566864" stroke-width="1.4" marker-end="url(#ar-muted)"/>
  <line x1="520" y1="88" x2="598" y2="81" stroke="#566864" stroke-width="1.4" marker-end="url(#ar-muted)"/>
  <line x1="520" y1="106" x2="598" y2="136" stroke="#0e6b73" stroke-width="1.6" marker-end="url(#ar-accent)"/>
  <line x1="520" y1="124" x2="598" y2="197" stroke="#566864" stroke-width="1.4" marker-end="url(#ar-muted)"/>
</svg>

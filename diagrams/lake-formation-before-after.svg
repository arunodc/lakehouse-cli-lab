<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" role="img" aria-label="Diagram: before governance is configured, the curated Glue Catalog table has an auto-attached IAMAllowedPrincipals grant that lets any IAM principal with ordinary glue and s3 permissions read it, bypassing Lake Formation entirely. After configuration, that legacy grant is revoked, a designated Lake Formation admin controls all grants, and every principal needs an explicit Lake Formation grant to read the table — no grant means access denied even if IAM allows it.">
  <defs>
    <marker id="lf-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a5342f"/></marker>
    <marker id="lf-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f7a4f"/></marker>
    <marker id="lf-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0e6b73"/></marker>
  </defs>

  <rect x="0" y="0" width="860" height="380" fill="#ffffff"/>

  <rect x="20" y="20" width="390" height="330" rx="12" fill="#f8e2e0" stroke="#a5342f" stroke-width="2"/>
  <text x="215" y="44" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="11" font-weight="700" letter-spacing="0.04em" fill="#a5342f">BEFORE — LEGACY DEFAULT</text>

  <rect x="60" y="60" width="310" height="55" rx="8" fill="#ffffff" stroke="#dbe4e0" stroke-width="1.4"/>
  <text x="215" y="80" text-anchor="middle" font-family="'Public Sans', system-ui, sans-serif" font-size="9" fill="#566864">Glue Catalog table</text>
  <text x="215" y="98" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="9.5" font-weight="700" fill="#16211f">curated.insurance_claims_iceberg</text>

  <line x1="215" y1="145" x2="215" y2="118" stroke="#a5342f" stroke-width="1.6" marker-end="url(#lf-danger)"/>
  <rect x="60" y="147" width="310" height="52" rx="8" fill="#ffffff" stroke="#a5342f" stroke-width="1.4"/>
  <text x="215" y="167" text-anchor="middle" font-family="'Public Sans', system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#a5342f">IAMAllowedPrincipals grant</text>
  <text x="215" y="184" text-anchor="middle" font-family="'Public Sans', system-ui, sans-serif" font-size="8" fill="#566864">auto-attached via CreateTableDefaultPermissions</text>

  <line x1="215" y1="225" x2="215" y2="201" stroke="#a5342f" stroke-width="1.6" marker-end="url(#lf-danger)"/>
  <rect x="60" y="227" width="310" height="93" rx="8" fill="#ffffff" stroke="#dbe4e0" stroke-width="1.4"/>
  <text x="215" y="247" text-anchor="middle" font-family="'Public Sans', system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#16211f">ANY IAM principal</text>
  <text x="215" y="264" text-anchor="middle" font-family="'Public Sans', system-ui, sans-serif" font-size="8.5" fill="#566864">with ordinary glue:Get* / s3:* permissions</text>
  <text x="215" y="280" text-anchor="middle" font-family="'Public Sans', system-ui, sans-serif" font-size="8.5" fill="#566864">no Lake Formation grant needed at all</text>
  <text x="215" y="300" text-anchor="middle" font-family="'Public Sans', system-ui, sans-serif" font-size="8.5" font-weight="700" fill="#a5342f">Lake Formation is effectively bypassed</text>

  <line x1="412" y1="190" x2="448" y2="190" stroke="#0e6b73" stroke-width="2" marker-end="url(#lf-accent)"/>
  <text x="430" y="178" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="9" font-weight="700" fill="#0e6b73">CONFIGURE LF</text>

  <rect x="450" y="20" width="390" height="330" rx="12" fill="#e2f2e7" stroke="#2f7a4f" stroke-width="2"/>
  <text x="645" y="44" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="11" font-weight="700" letter-spacing="0.04em" fill="#2f7a4f">AFTER — GOVERNED</text>

  <rect x="490" y="60" width="310" height="55" rx="8" fill="#ffffff" stroke="#dbe4e0" stroke-width="1.4"/>
  <text x="645" y="80" text-anchor="middle" font-family="'Public Sans', system-ui, sans-serif" font-size="9" fill="#566864">Glue Catalog table</text>
  <text x="645" y="98" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="9.5" font-weight="700" fill="#16211f">curated.insurance_claims_iceberg</text>

  <line x1="645" y1="145" x2="645" y2="118" stroke="#2f7a4f" stroke-width="1.6" marker-end="url(#lf-ok)"/>
  <rect x="490" y="147" width="310" height="42" rx="8" fill="#ffffff" stroke="#dbe4e0" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="645" y="165" text-anchor="middle" font-family="'Public Sans', system-ui, sans-serif" font-size="9.5" fill="#566864">IAMAllowedPrincipals — revoked</text>
  <text x="645" y="180" text-anchor="middle" font-family="'Public Sans', system-ui, sans-serif" font-size="8" fill="#566864">legacy default emptied + explicit revoke</text>

  <line x1="645" y1="205" x2="645" y2="191" stroke="#2f7a4f" stroke-width="1.6" marker-end="url(#lf-ok)"/>
  <rect x="490" y="207" width="310" height="42" rx="8" fill="#ffffff" stroke="#dbe4e0" stroke-width="1.4"/>
  <text x="645" y="225" text-anchor="middle" font-family="'Public Sans', system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#16211f">DataLakeAdmins: arun-admin</text>
  <text x="645" y="240" text-anchor="middle" font-family="'Public Sans', system-ui, sans-serif" font-size="8" fill="#566864">only identity that can grant/revoke LF permissions</text>

  <line x1="645" y1="265" x2="645" y2="251" stroke="#2f7a4f" stroke-width="1.6" marker-end="url(#lf-ok)"/>
  <rect x="490" y="267" width="310" height="72" rx="8" fill="#ffffff" stroke="#2f7a4f" stroke-width="1.6"/>
  <text x="645" y="286" text-anchor="middle" font-family="'Public Sans', system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#2f7a4f">Explicit Lake Formation grant required</text>
  <text x="645" y="302" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="8.5" fill="#566864">per principal, per table/tag</text>
  <text x="645" y="318" text-anchor="middle" font-family="'Public Sans', system-ui, sans-serif" font-size="8.5" fill="#566864">no grant = AccessDenied, even with IAM allowed</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" role="img" aria-label="Diagram: step one grants LakehouseAnalyst SELECT via an LF-Tag, giving allowed but unfiltered access. That tag grant is then revoked. Step two grants SELECT via a Data Cells Filter instead, giving allowed and filtered access. A warning box explains that if the tag grant is not revoked before the filter grant, Lake Formation does not intersect the two grants — the broader unfiltered grant wins and the filter has no effect.">
  <defs>
    <marker id="tl-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#566864"/></marker>
    <marker id="tl-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a5342f"/></marker>
  </defs>

  <rect x="0" y="0" width="900" height="320" fill="#ffffff"/>

  <rect x="20" y="30" width="230" height="110" rx="8" fill="#ffffff" stroke="#dbe4e0" stroke-width="1.4"/>
  <text x="135" y="50" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="11" font-weight="700" fill="#0e6b73">1</text>
  <text x="135" y="68" text-anchor="middle" font-family="'Public Sans', system-ui, sans-serif" font-size="10" font-weight="700" fill="#16211f">LF-Tag grant</text>
  <text x="135" y="85" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="8.5" fill="#566864">module=Claims → SELECT</text>
  <text x="135" y="103" text-anchor="middle" font-family="'Public Sans', system-ui, sans-serif" font-size="9" font-weight="700" fill="#16211f">allowed, UNFILTERED</text>
  <text x="135" y="119" text-anchor="middle" font-family="'Public Sans', system-ui, sans-serif" font-size="8" fill="#566864">all rows, all columns</text>

  <line x1="250" y1="85" x2="318" y2="85" stroke="#566864" stroke-width="1.6" marker-end="url(#tl-muted)"/>
  <text x="284" y="72" text-anchor="middle" font-family="'Public Sans', system-ui, sans-serif" font-size="8" fill="#16211f">revoke-permissions</text>
  <text x="284" y="100" text-anchor="middle" font-family="'Public Sans', system-ui, sans-serif" font-size="8" fill="#16211f">(the tag grant)</text>

  <rect x="320" y="30" width="230" height="110" rx="8" fill="#ffffff" stroke="#dbe4e0" stroke-width="1.4"/>
  <text x="435" y="55" text-anchor="middle" font-family="'Public Sans', system-ui, sans-serif" font-size="10" font-weight="700" fill="#16211f">Revoke the tag grant</text>
  <text x="435" y="75" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="8" fill="#566864">lakeformation revoke-permissions</text>
  <text x="435" y="97" text-anchor="middle" font-family="'Public Sans', system-ui, sans-serif" font-size="8.5" fill="#566864">before granting the filter —</text>
  <text x="435" y="113" text-anchor="middle" font-family="'Public Sans', system-ui, sans-serif" font-size="8.5" fill="#566864">otherwise both grants coexist</text>

  <line x1="550" y1="85" x2="618" y2="85" stroke="#566864" stroke-width="1.6" marker-end="url(#tl-muted)"/>
  <text x="584" y="72" text-anchor="middle" font-family="'Public Sans', system-ui, sans-serif" font-size="8" fill="#16211f">grant-permissions</text>
  <text x="584" y="100" text-anchor="middle" font-family="'Public Sans', system-ui, sans-serif" font-size="8" fill="#16211f">(the filter)</text>

  <rect x="620" y="30" width="230" height="110" rx="8" fill="#ffffff" stroke="#2f7a4f" stroke-width="1.8"/>
  <text x="735" y="50" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="11" font-weight="700" fill="#2f7a4f">2</text>
  <text x="735" y="68" text-anchor="middle" font-family="'Public Sans', system-ui, sans-serif" font-size="10" font-weight="700" fill="#16211f">Data Cells Filter grant</text>
  <text x="735" y="85" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="8.5" fill="#566864">southeast_only, excl. smoker</text>
  <text x="735" y="103" text-anchor="middle" font-family="'Public Sans', system-ui, sans-serif" font-size="9" font-weight="700" fill="#2f7a4f">allowed, FILTERED</text>
  <text x="735" y="119" text-anchor="middle" font-family="'Public Sans', system-ui, sans-serif" font-size="8" fill="#566864">region=southeast, no smoker col</text>

  <line x1="135" y1="140" x2="300" y2="200" stroke="#a5342f" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#tl-danger)"/>
  <text x="210" y="178" text-anchor="middle" font-family="'Public Sans', system-ui, sans-serif" font-size="8.5" fill="#a5342f">skip the revoke →</text>

  <rect x="170" y="200" width="560" height="95" rx="8" fill="#f8e2e0" stroke="#a5342f" stroke-width="1.6"/>
  <text x="450" y="222" text-anchor="middle" font-family="'Public Sans', system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#a5342f">If the tag grant is NOT revoked before the filter grant</text>
  <text x="450" y="240" text-anchor="middle" font-family="'Public Sans', system-ui, sans-serif" font-size="8.5" fill="#566864">the principal holds BOTH an unfiltered grant and a filtered grant</text>
  <text x="450" y="258" text-anchor="middle" font-family="'Public Sans', system-ui, sans-serif" font-size="9" font-weight="700" fill="#a5342f">Lake Formation does not intersect them — the broader grant wins</text>
  <text x="450" y="277" text-anchor="middle" font-family="'Public Sans', system-ui, sans-serif" font-size="8.5" fill="#566864">the filter silently has zero effect; the query still returns everything</text>
</svg>
